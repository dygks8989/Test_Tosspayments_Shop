<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 완료 | WEARHOUSE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <main class="result" id="result"></main>
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script>
    boot(async () => {
      renderHeader();
      renderFooter();
      if (!requireLogin()) return;

      const params = new URLSearchParams(location.search);
      const paymentKey = params.get("paymentKey");
      const orderId = params.get("orderId");
      const amount = Number(params.get("amount"));
      const el = document.getElementById("result");

      el.innerHTML = `<p class="desc">결제를 확인하는 중입니다…</p>`;

      // 서버가 토스에 결제 승인을 요청하고 주문 금액과 대조한다. 새로고침해도 주문은 한 번만 처리된다.
      let res;
      try {
        res = await callOrders({ action: "confirm", paymentKey, orderId, amount });
      } catch (err) {
        res = { ok: false, message: err.message };
      }

      if (!res.ok) {
        el.innerHTML = `
          <div class="icon fail">!</div>
          <h1>결제를 완료하지 못했습니다</h1>
          <p class="desc">${esc(res.message)}</p>
          <div class="actions"><a class="btn btn-line" href="index.html">홈으로</a><a class="btn btn-black" href="checkout.html">다시 결제하기</a></div>`;
        return;
      }

      try { sessionStorage.removeItem(CHECKOUT_KEY); } catch {}
      // 장바구니에서 결제한 경우 서버가 장바구니를 비웠으므로 다시 불러온다
      await Cart.load();
      renderCartCount();

      el.innerHTML = `
        <div class="icon">✓</div>
        <h1>결제가 완료되었습니다</h1>
        <p class="desc">주문해 주셔서 감사합니다.</p>
        <dl>
          <div><dt>주문번호</dt><dd>${esc(res.orderId)}</dd></div>
          <div><dt>주문상품</dt><dd>${esc(res.orderName)}</dd></div>
          <div><dt>결제금액</dt><dd>${won(res.amount)}</dd></div>
          <div><dt>결제수단</dt><dd>${esc(res.method || "-")}</dd></div>
        </dl>
        <div class="actions"><a class="btn btn-line" href="index.html">쇼핑 계속하기</a><a class="btn btn-black" href="mypage.html#orders">주문 내역 보기</a></div>`;
    });
  </script>
</body>
</html>
