<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 완료 | WEARHOUSE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <main class="result" id="result"></main>
  <div id="footer"></div>

  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script>
    renderHeader();
    renderFooter();

    const params = new URLSearchParams(location.search);
    const paymentKey = params.get("paymentKey");
    const orderId = params.get("orderId");
    const amount = Number(params.get("amount"));
    const order = load(sessionStorage, "ws_order", null);
    const el = document.getElementById("result");

    // 결제 요청 때 저장한 주문 정보와 리다이렉트로 받은 값이 같은지 확인
    const valid = order && order.orderId === orderId && order.amount === amount && paymentKey;

    if (!valid) {
      el.innerHTML = `
        <div class="icon fail">!</div>
        <h1>결제 정보가 일치하지 않습니다</h1>
        <p class="desc">주문 금액 또는 주문번호가 요청과 다릅니다. 결제가 승인되지 않습니다.</p>
        <div class="actions"><a class="btn btn-line" href="index.html">홈으로</a><a class="btn btn-black" href="checkout.html">다시 결제하기</a></div>`;
    } else {
      // 주문 내역 기록 (마이페이지에서 확인)
      Orders.add({ orderId, amount, items: order.items, orderName: order.orderName, date: new Date().toISOString(), email: Auth.current()?.email || null });
      // 장바구니에서 결제한 경우 장바구니 비우기
      if (order.fromCart) Cart.set([]);
      try { sessionStorage.removeItem(CHECKOUT_KEY); } catch {}

      el.innerHTML = `
        <div class="icon">✓</div>
        <h1>결제 요청이 완료되었습니다</h1>
        <p class="desc">주문해 주셔서 감사합니다.</p>
        <dl>
          <div><dt>주문번호</dt><dd>${orderId}</dd></div>
          <div><dt>주문상품</dt><dd>${order.orderName}</dd></div>
          <div><dt>결제금액</dt><dd>${won(amount)}</dd></div>
          <div><dt>paymentKey</dt><dd>${esc(paymentKey)}</dd></div>
        </dl>
        <p class="note">
          <b>퍼블리싱 안내</b> — 여기까지는 결제 <b>인증</b> 단계입니다. 실제로 결제를 확정하려면
          서버에서 시크릿 키로 <code>POST https://api.tosspayments.com/v1/payments/confirm</code>
          (paymentKey, orderId, amount)을 호출해야 합니다. 승인 API를 10분 안에 호출하지 않으면 결제가 만료됩니다.
        </p>
        <div class="actions"><a class="btn btn-line" href="index.html">쇼핑 계속하기</a><a class="btn btn-black" href="${Auth.current() ? "mypage.html" : "login.html?next=mypage.html"}">주문 내역 보기</a></div>`;
    }
  </script>
</body>
</html>
