<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바지 | WEARHOUSE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-cat="pants">
  <div id="header"></div>

  <main>
    <section class="banner">
      <div class="inner">
        <div>
          <span class="tag">WEEKLY BEST</span>
          <h1 id="bannerTitle"></h1>
          <p id="bannerDesc"></p>
        </div>
        <span class="banner-count">실시간 판매량 기준</span>
      </div>
    </section>

    <section class="toolbar">
      <div class="inner">
        <div class="chips" id="chips"></div>
        <div class="sort">
          <select id="sort" aria-label="정렬">
            <option value="rank">랭킹순</option>
            <option value="low">낮은 가격순</option>
            <option value="high">높은 가격순</option>
            <option value="discount">할인율순</option>
            <option value="review">후기순</option>
          </select>
        </div>
      </div>
    </section>

    <section class="product-section">
      <div class="inner">
        <p id="count" style="font-size:12px;color:#808080;margin-bottom:16px"></p>
        <div class="grid" id="grid"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
