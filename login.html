  <main class="auth">
    <h1>LOGIN</h1>
    <p class="sub">WEARHOUSE 회원 로그인</p>
    <form id="loginForm" novalidate>
      <label for="email">이메일</label>
      <input type="email" id="email" autocomplete="email" placeholder="example@email.com" required>
      <label for="password">비밀번호</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="비밀번호" required>
      <label class="check"><input type="checkbox" id="keep"> 로그인 상태 유지</label>
      <p class="error" id="error"></p>
      <button type="submit" class="btn btn-black">로그인</button>
    </form>
    <div class="links"><a href="signup.html">회원가입</a><a href="#" onclick="toast('준비 중인 기능입니다.'); return false;">아이디 · 비밀번호 찾기</a></div>
    <p class="divider">또는</p>
    <div class="social">
      <button type="button" class="kakao" onclick="toast('소셜 로그인은 퍼블리싱 화면만 제공됩니다.')">카카오로 시작하기</button>
      <button type="button" onclick="toast('소셜 로그인은 퍼블리싱 화면만 제공됩니다.')">Apple로 시작하기</button>
    </div>
  </main>

<footer class="footer"><div class="inner"><strong>WEARHOUSE</strong> WEARHOUSE는 실제 상품을 판매하지 않는 퍼블리싱·결제 연동 데모 쇼핑몰입니다. 결제는 토스페이먼츠 테스트 환경에서 이뤄져 실제 금액이 청구되지 않고, 상품과 브랜드는 모두 가상입니다.

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script>
    boot(() => {
      renderHeader();
      renderFooter();

      // 로그인 후 원래 보던 페이지로 복귀
      const target = nextTarget();
      if (Auth.current()) location.replace(target);

      document.querySelector(".links a[href='signup.html']").href = "signup.html" + location.search;

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const error = document.getElementById("error");
        if (!email || !password) return (error.textContent = "이메일과 비밀번호를 입력해주세요.");
        try {
          await Auth.login(email, password);
          location.href = target;
        } catch (err) {
          error.textContent = err.message;
        }
      });
    });
  </script>
</body>
