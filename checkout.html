<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문/결제 | WEARHOUSE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- 토스페이먼츠 결제위젯 SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
  <div id="header"></div>

  <main class="inner">
    <h1 class="page-title">주문서</h1>

    <div class="checkout">
      <div>
        <h2 class="section-title">주문 상품</h2>
        <div class="order-items" id="orderItems"></div>

        <h2 class="section-title">주문자 정보</h2>
        <form class="form-grid" id="buyerForm" onsubmit="return false">
          <label for="name">이름</label>
          <input id="name" value="홍길동" autocomplete="name" required>
          <label for="phone">휴대폰 번호</label>
          <input id="phone" value="01012345678" inputmode="numeric" autocomplete="tel" required>
          <label for="email">이메일</label>
          <input id="email" type="email" value="customer@example.com" autocomplete="email">
          <label for="address">배송지</label>
          <input id="address" value="서울특별시 강남구 테헤란로 1" autocomplete="street-address">
          <label for="memo">배송 메모</label>
          <select id="memo">
            <option>문 앞에 놔주세요</option>
            <option>경비실에 맡겨주세요</option>
            <option>배송 전 연락 부탁드립니다</option>
          </select>
        </form>

        <h2 class="section-title">결제 수단</h2>
        <!-- 토스페이먼츠 결제 UI / 약관 UI 렌더링 영역 -->
        <div id="payment-method"></div>
        <div id="agreement"></div>
      </div>

      <aside class="summary">
        <h2 style="font-size:16px;font-weight:800;margin-bottom:12px">결제 금액</h2>
        <div class="row"><span>상품 금액</span><span id="sumOrigin">0원</span></div>
        <div class="row"><span>할인 금액</span><span id="sumDiscount">0원</span></div>
        <div class="row"><span>배송비</span><span>무료</span></div>
        <div class="row total"><span>최종 결제 금액</span><span id="sumTotal">0원</span></div>
        <button type="button" class="btn btn-toss" id="payBtn" disabled>결제 수단 불러오는 중…</button>
        <p class="notice">
          토스페이먼츠 <b>테스트 환경</b>입니다. 결제창에서 테스트 결제를 진행해도 실제 금액은 청구되지 않습니다.
        </p>
      </aside>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
